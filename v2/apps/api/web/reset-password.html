<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset password · SecureLink</title>
  <link rel="stylesheet" href="/assets/account.css">
</head>
<body>
  <main class="card">
    <p class="brand">SecureLink</p>
    <h1>Set a new password</h1>
    <p id="status" role="status" aria-live="polite">Preparing your reset link…</p>
    <form id="reset-form" hidden>
      <label for="password">New password</label>
      <input id="password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
      <button type="submit">Reset password</button>
    </form>
    <a href="/">Return to SecureLink</a>
  </main>
  <script src="/assets/reset-password.js" defer></script>
</body>
</html>
