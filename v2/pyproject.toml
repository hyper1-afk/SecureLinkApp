[build-system]
requires = ["setuptools>=75,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "securelink-v2-api"
version = "0.1.0"
description = "Evidence-first security operations platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.9,<3",
  "cryptography>=45,<51",
  "dnspython>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "httpx>=0.27,<1", "ruff>=0.6,<1", "pip-audit>=2.7,<3"]

[tool.setuptools.package-data]
"apps.api" = ["web/*.html", "web/*.css", "web/*.js"]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["apps", "packages"]
