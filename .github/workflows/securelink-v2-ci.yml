name: SecureLink V2 CI

on:
  push:
    branches:
      - securelink-v2
      - "feature/**"
  pull_request:
    branches:
      - securelink-v2

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: securelink
          POSTGRES_PASSWORD: securelink-ci-password
          POSTGRES_DB: securelink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U securelink -d securelink"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://securelink:securelink-ci-password@localhost:5432/securelink
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/pyproject.toml

      - name: Install API and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check apps tests

      - name: Apply PostgreSQL migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q

      - name: Build API container
        run: docker build -f apps/api/Dockerfile -t securelink-v2-api:ci .
