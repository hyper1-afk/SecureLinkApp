name: SecureLink V2 CI

on:
  push:
    branches:
      - main
      - securelink-v2
      - "feature/**"
  pull_request:
    branches:
      - main
      - securelink-v2

permissions:
  contents: read

jobs:
  secret-history:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Guard full history against exposed credentials and secret files
        run: python v2/scripts/audit_repo_history.py

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: securelink
          POSTGRES_PASSWORD: securelink-ci-password
          POSTGRES_DB: securelink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U securelink -d securelink"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://securelink:securelink-ci-password@localhost:5432/securelink
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/pyproject.toml

      - name: Install API and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Test legacy scanner network safety
        run: python -m unittest discover -s ../tests -p "test_network_safety.py" -v

      - name: Lint
        run: ruff check apps tests scripts/audit_repo_history.py

      - name: Check browser JavaScript syntax
        run: |
          node --check apps/api/web/account.js
          node --check apps/api/web/accept-invitation.js
          node --check apps/api/web/dashboard.js
          node --check apps/api/web/extension-authorize.js
          node --check apps/api/web/reset-password.js
          node --check apps/api/web/verify-email.js
          node --check extension/service-worker.js
          node --check extension/popup.js
          node --check extension/oauth.js
          node --check extension/url-privacy.js
          node --test extension/tests/oauth.test.js
          node --test extension/tests/url-privacy.test.js
          node --test extension/tests/permissions.test.js
          node --check ../browser-extension/background.js
          node --check ../browser-extension/content.js
          node --check ../browser-extension/popup.js
          node --check ../browser-extension/api-origin.js
          node --check ../browser-extension/v2-popup.js
          node --check ../browser-extension/v2-oauth.js
          node --check ../browser-extension/url-privacy.js
          node --check ../browser-extension/legacy-scan.js
          node --check ../browser-extension/warning.js
          node --check ../browser-extension/warning-state.js
          node --test ../browser-extension/tests/v2-oauth.test.js
          node --test ../browser-extension/tests/api-origin.test.js
          node --test ../browser-extension/tests/url-privacy.test.js
          node --check ../static/js/password-exposure-check.mjs
          node --test ../browser-extension/tests/password-exposure.test.mjs
          node --test ../browser-extension/tests/legacy-scan.test.js
          node --test ../browser-extension/tests/content-network-boundary.test.js
          node --test ../browser-extension/tests/warning-state.test.js

      - name: Audit Python dependencies
        run: pip-audit

      - name: Apply PostgreSQL migrations
        run: alembic upgrade head

      - name: Verify latest migration downgrade and reapply
        run: |
          alembic downgrade 0018_threat_indicators
          alembic upgrade head

      - name: Run tests
        run: pytest -q

      - name: Validate Docker Compose configuration
        run: |
          python scripts/init_local_env.py
          docker compose --profile local-mail config --quiet

      - name: Start local stack and verify readiness
        run: |
          unset DATABASE_URL
          trap 'docker compose --profile local-mail down --volumes' EXIT
          if ! docker compose --profile local-mail up --build --detach; then
            docker compose ps --all
            docker compose logs api migrate email-worker domain-monitor-worker threat-feed-worker
            exit 1
          fi
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose ps --all
            docker compose logs api migrate email-worker domain-monitor-worker threat-feed-worker
            exit 1
          fi
          docker compose ps --all --format json > "$RUNNER_TEMP/compose-ps.jsonl"
          python - "$RUNNER_TEMP/compose-ps.jsonl" <<'PY'
          import json
          import sys
          from pathlib import Path

          rows = [
              json.loads(line)
              for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          services = {row["Service"]: row for row in rows}
          expected_workers = {"email-worker", "domain-monitor-worker", "threat-feed-worker"}
          expected_services = expected_workers | {"api", "migrate", "postgres", "redis", "mailpit"}
          missing = expected_services - services.keys()
          if missing:
              raise SystemExit(f"Local Compose services are missing: {sorted(missing)}")
          if services["migrate"]["State"] != "exited" or services["migrate"]["ExitCode"] != 0:
              raise SystemExit("The one-shot database migration service did not complete successfully")
          if services["api"]["State"] != "running" or services["api"]["Health"] != "healthy":
              raise SystemExit("The V2 API is not healthy")
          for name in expected_workers:
              if services[name]["State"] != "running":
                  raise SystemExit(f"V2 worker {name} is not running")
          for name in ("postgres", "redis", "mailpit"):
              if services[name]["State"] != "running" or services[name]["Health"] != "healthy":
                  raise SystemExit(f"Local dependency {name} is not healthy")
          print("V2 API, migration, workers, and local dependencies are healthy.")
          PY

