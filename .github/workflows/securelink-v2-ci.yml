name: SecureLink V2 CI

on:
  push:
    branches:
      - securelink-v2
      - "feature/**"
  pull_request:
    branches:
      - securelink-v2

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: securelink
          POSTGRES_PASSWORD: securelink-ci-password
          POSTGRES_DB: securelink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U securelink -d securelink"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://securelink:securelink-ci-password@localhost:5432/securelink
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/pyproject.toml

      - name: Install API and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check apps tests

      - name: Audit Python dependencies
        run: pip-audit

      - name: Apply PostgreSQL migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Start local stack and verify readiness
        run: |
          trap 'docker compose down --volumes' EXIT
          docker compose up --build --detach
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api
          exit 1
